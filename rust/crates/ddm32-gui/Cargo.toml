[package]
name = "ddm32-gui"
description = "DDM32 Plus programmer: the window (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "ddm32-gui"
path = "src/main.rs"

[features]
default = []
# The serial port (the radio steps). OFF by default; the release build enables it (see rust/README.md).
radio = ["ddm32-core/radio"]
developer = ["ddm32-core/developer"]

[dependencies]
ddm32-core = { path = "../ddm32-core" }
slint = { version = "=1.16.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts"] }
rfd = "0.15"
serde_json = "1"

[build-dependencies]
slint-build = "=1.16.1"

[dev-dependencies]
hex = "0.4"
base64 = "0.22"
flate2 = "1"
png = "0.18"
regex = "1"
